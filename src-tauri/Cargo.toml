[package]
name = "rgg-inventory"
version = "0.2.0"
description = "RGG Inventory — оверлей-инвентарь для RGG-стримеров"
authors = [ "rgg" ]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rgg_inventory_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-http = "2.5.8"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
tauri-plugin-global-shortcut = "2.3.2"
