<tui-root>
	@if (shell.widgetMode(); as widgetId) {
		<div appThemeHost class="app-widget-page-host">
			<app-widgets-page [widget]="widgetId" />
		</div>
	} @else if (shell.overlayMode()) {
		<div appThemeHost class="app-overlay-page-host">
			<app-overlay-page />
		</div>
	} @else {
		<div appThemeHost class="app-shell" [style.background]="shell.appBackground()">
			<app-overlay-bar />
			<app-download-notice />
			<app-tutorial />
		</div>
	}
</tui-root>
