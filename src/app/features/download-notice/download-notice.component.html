@if (visible()) {
	<aside class="download-notice" role="status">
		<div class="download-notice-text">
			<strong class="download-notice-title">Доступно скачивание приложения v{{ version() }}</strong>
			<span class="download-notice-subtitle">
				Доступна десктопная версия для Windows, macOS и Linux — удобно для OBS.
			</span>
		</div>
		<div class="download-notice-actions">
			<button tuiButton type="button" size="s" (click)="openSettings()">
				Открыть настройки
			</button>
			<button
				tuiButton
				type="button"
				appearance="flat"
				size="s"
				aria-label="Скрыть уведомление"
				iconStart="@tui.x"
				(click)="dismiss()"
			></button>
		</div>
	</aside>
}
