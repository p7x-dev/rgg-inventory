<div class="item" [title]="title()">
	@if (icon()) {
		<img class="item-icon" [src]="icon()" alt="" loading="lazy" />
	} @else {
		<span class="item-fallback">{{ entry().name.charAt(0).toUpperCase() }}</span>
	}
	<span class="item-name">{{ entry().name }}</span>
	@if ((entry().quantity ?? 1) > 1) {
		<span class="item-count">×{{ entry().quantity }}</span>
	}
</div>
