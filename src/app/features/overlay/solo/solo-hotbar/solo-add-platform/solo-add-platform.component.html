<button
	tuiButton
	type="button"
	appearance="flat"
	class="add"
	iconStart="@tui.plus"
	[attr.aria-label]="'Добавить платформу'"
	[tuiDropdown]="menu"
	[(tuiDropdownOpen)]="dropdownOpen"
></button>

<ng-template #menu>
	<tui-data-list [size]="'m'">
		@for (platform of platforms(); track platform) {
			<button tuiOption type="button" (click)="select(platform)">
				{{ platform }}
			</button>
		}
	</tui-data-list>
</ng-template>
