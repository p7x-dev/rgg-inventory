<button
	class="slot"
	type="button"
	[attr.aria-label]="label()"
	[title]="tooltip()"
	(click)="onClick()"
>
	<span class="slot-head">
		@if (iconSrc(); as icon) {
			<img class="slot-icon" [src]="icon" alt="" />
		} @else {
			<span class="slot-platform">{{ shortName() }}</span>
		}
		@if (currentGame(); as game) {
			<span class="slot-game" title="{{ game }}">{{ game }}</span>
		}
	</span>
	<span class="slot-stats">
		<span class="slot-stat slot-stat--completed">{{ stats().completed }}</span>
		<span class="slot-stat slot-stat--skip">{{ stats().skip }}</span>
		<span class="slot-stat slot-stat--reroll">{{ stats().reroll }}</span>
	</span>
</button>
