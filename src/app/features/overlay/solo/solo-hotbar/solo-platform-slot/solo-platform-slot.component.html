<button
	class="slot"
	type="button"
	[attr.aria-label]="label()"
	[title]="tooltip()"
	(click)="onClick()"
>
	@if (iconSrc(); as icon) {
		<img class="slot-icon" [src]="icon" alt="" draggable="false" />
	}
	<span class="slot-platform">{{ shortName() }}</span>
	@if (completedCount() > 0) {
		<span class="slot-count">×{{ completedCount() }}</span>
	}
	@if (removable()) {
		<button
			class="slot-remove"
			type="button"
			[attr.aria-label]="'Удалить платформу ' + label()"
			(click)="onRemove($event)"
		>
			×
		</button>
	}
</button>
