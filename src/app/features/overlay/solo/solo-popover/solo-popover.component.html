<div class="popover">
	@if (selectedRow(); as row) {
		<app-solo-game-details
			[row]="row"
			[isCurrent]="selectedIsCurrent()"
			[gameInfo]="gameInfo()"
			(back)="onBack()"
			(close)="onClose()"
		/>
	} @else {
		<app-solo-game-list
			[platform]="platform()"
			[rows]="rows()"
			[currentGame]="currentGame()"
			[stats]="stats()"
			(gameSelect)="onSelectRow($event)"
			(close)="onClose()"
		/>
	}
</div>
