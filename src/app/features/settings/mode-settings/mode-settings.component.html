<section class="section">
	<h2 class="section-title">Режим</h2>
	<p class="section-subtitle">Что показывает оверлей</p>

	<p class="hint">
		RGG Land — инвентарь с монетками и слёзами. Solo RGG — платформы с играми
		из твоей Google-таблицы. У каждого режима свой источник и свои настройки.
	</p>

	<div class="preset-row">
		@for (option of options; track option.id) {
			<button
				tuiButton
				type="button"
				[appearance]="activeMode() === option.id ? 'primary' : 'secondary'"
				(click)="setMode(option.id)"
			>
				{{ option.label }}
			</button>
		}
	</div>
</section>
