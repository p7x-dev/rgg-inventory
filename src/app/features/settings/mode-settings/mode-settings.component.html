<app-settings-panel title="Режим" subtitle="Что показывает оверлей">
	<app-settings-hint>
		RGG Land — инвентарь с монетками и слёзами. Solo RGG — платформы с играми
		из твоей Google-таблицы. У каждого режима свой источник и свои настройки.
	</app-settings-hint>

	<app-settings-preset-row>
		@for (option of options; track option.id) {
			<button
				tuiButton
				type="button"
				[appearance]="activeMode() === option.id ? 'primary' : 'secondary'"
				(click)="setMode(option.id)"
			>
				{{ option.label }}
			</button>
		}
	</app-settings-preset-row>
</app-settings-panel>
