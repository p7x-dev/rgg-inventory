<div class="mode-switch" role="tablist" aria-label="Режим оверлея">
	@for (option of options; track option.id) {
		<button
			tuiButton
			type="button"
			size="s"
			[appearance]="mode() === option.id ? 'primary' : 'secondary'"
			role="tab"
			[attr.aria-selected]="mode() === option.id"
			(click)="selectMode(option.id)"
		>
			{{ option.label }}
		</button>
	}
</div>
