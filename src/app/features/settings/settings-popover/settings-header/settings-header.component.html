<header class="popover-header">
	<tui-icon icon="@tui.settings" class="popover-header-icon" />
	<h2 class="popover-header-title">Настройки</h2>
	<app-mode-switch [mode]="mode()" (modeChange)="modeChange.emit($event)" />
	<button
		tuiButton
		type="button"
		appearance="flat"
		iconStart="@tui.x"
		class="popover-close"
		aria-label="Закрыть"
		(click)="close.emit()"
	></button>
</header>
